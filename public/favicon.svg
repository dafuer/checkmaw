<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Checkmaw: a pawn whose head opens into a toothy maw. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ecd8"/>
      <stop offset="1" stop-color="#c9b48a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1b1430"/>
  <!-- Base and stem -->
  <path d="M14 56h36v-5c0-3-3-5-6-5H20c-3 0-6 2-6 5z" fill="url(#body)"/>
  <path d="M24 46c1-6 2-11 3-15h10c1 4 2 9 3 15z" fill="url(#body)"/>
  <rect x="21" y="28" width="22" height="4" rx="2" fill="#e0a43a"/>
  <!-- Lower jaw -->
  <path d="M19 22c0 5 6 7 13 7s13-2 13-7z" fill="url(#body)"/>
  <!-- Upper jaw, tilted open -->
  <path d="M20 17c-1-8 5-13 12-13s13 5 12 13c-4 1-8 1-12 1s-8 0-12-1z" fill="url(#body)" transform="rotate(-12 20 17)"/>
  <!-- Mouth and teeth -->
  <path d="M19 22c4-1 8-1 13-1s9 0 13 1c-2-3-6-6-13-6-6 0-10 2-13 6z" fill="#b0123a"/>
  <path d="M22 22l2-4 2 4zM28 21l2-4 2 4zM34 21l2-4 2 4zM40 22l2-4 2 3z" fill="#fff"/>
  <!-- Glowing eye -->
  <circle cx="35" cy="9" r="2.6" fill="#ffb347"/>
</svg>
